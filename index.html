<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Previsão do Tempo</title>
</head>
<body>
  <div class="caixa-maior">
    <input type="text" placeholder="Digite a cidade" class="input-cidade">
    
    <button class="botao" onclick="detectaVoz()">
      <img width="15px" height="15px" src="https://img.icons8.com/ios-filled/15px/FFFFFF/microphone--v1.png" alt="microphone--v1" class="img-botao"/>
    </button>
    <button class="botao" onclick="cliqueiNoBotao()">
      <img width="15px" height="15px" src="https://img.icons8.com/glyph-neue/15px/FFFFFF/search--v1.png" alt="search--v1" class="img-botao"/>
    </button>
    
    <div class="caixa-media escondido">
      <h2 class="cidade"></h2>
      <p class="temperatura"></p>
      <img class="icone">
      <p class="umidade"></p>
      <button class="roupa" onclick="pedirSugestaoRoupa()"></button>
      <p class="respostaIa"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
